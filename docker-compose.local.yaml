services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TYPEORM_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD:-postgres}
      POSTGRES_DB: ${TYPEORM_DATABASE:-fanhatch}
    ports:
      - '5432:5432'
    volumes:
      - fanhatch_pg:/var/lib/postgresql/data

volumes:
  fanhatch_pg:
